<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>轨道贪吃蛇 · 手动与 AI</title>
<style>
:root{--bg:#0b1420;--panel:#142236;--text:#eaf2ff;--muted:#a9bcd3;--line:#2b4059;--accent:#73e3b4;--food:#ffb67e}body.light{--bg:#f0f5f8;--panel:#fff;--text:#183248;--muted:#52697b;--line:#d6e1ea;--accent:#197757;--food:#cc6226}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}main{max-width:1060px;margin:36px auto;padding:0 20px}a{color:var(--accent)}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:32px;margin:8px 0}small,p{color:var(--muted);line-height:1.7}.layout{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}canvas{width:100%;aspect-ratio:1;display:block;border-radius:12px;touch-action:none}.stats{display:flex;gap:24px;margin-bottom:14px}.stats strong{display:block;font-size:25px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,select{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:10px 14px;border-radius:9px;font:inherit;cursor:pointer}button.primary{background:var(--accent);color:var(--bg);font-weight:700}button:focus-visible,select:focus-visible{outline:3px solid var(--food)}#status{color:var(--accent);min-height:48px}li{line-height:1.9}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:8px 4px}.dpad{text-align:center}.dpad button{min-width:60px}.note{font-size:13px}@media(max-width:750px){main{margin:18px auto}.layout{grid-template-columns:1fr}h1{font-size:25px}}
</style>
<main><header><div><small>FRESHMAN LAB / 01</small><h1>轨道贪吃蛇</h1><p>先自己玩，再看 AI 连续吃完 15 个食物。</p></div><button id="theme">切换主题</button></header>
<div class="layout"><section class="card"><div class="stats"><div>本局得分<strong id="score">0</strong></div><div>历史最高<strong id="best">0</strong></div><div>已结束局数<strong id="games">0</strong></div></div><canvas id="board" width="600" height="600" aria-label="12 乘 12 贪吃蛇棋盘"></canvas><p id="status" role="status" aria-live="polite"></p><div class="controls"><button class="primary" id="manual">手动新一局</button><button id="ai">AI 自动演示</button><button id="pause">暂停 / 继续</button><label>速度 <select id="speed"><option value="160">慢速</option><option value="90" selected>标准</option><option value="25">快速演示</option></select></label></div><div class="dpad"><div><button data-dir="0,-1" aria-label="向上">↑</button></div><button data-dir="-1,0" aria-label="向左">←</button><button data-dir="0,1" aria-label="向下">↓</button><button data-dir="1,0" aria-label="向右">→</button></div></section>
<aside class="card"><h2>怎么玩</h2><ol><li>点击“手动新一局”，方向键 / WASD 或方向按钮控制。</li><li>吃一个食物得 1 分。撞墙或身体结束；填满棋盘通关。</li><li>空格暂停。触屏可在棋盘上滑动。</li><li>AI 按闭合路线行进；完成 15 个食物后自动停下展示验收结果。</li></ol><p>AI 从新局开始，保证蛇身与闭合路线顺序一致。按键不会干扰自动演示。</p><h2>最近 10 局</h2><table><thead><tr><th>模式</th><th>得分</th><th>结果</th></tr></thead><tbody id="history"></tbody></table><div class="controls"><button id="reset">重置全部战绩</button></div><p id="storage" class="note">主题与战绩保存在当前浏览器。新一局不会清空历史。</p><a href="../index.html">← 返回个人主页</a></aside></div></main>
<script>
'use strict';
const N=12, KEY='freshman-snake-v1', $=id=>document.getElementById(id);
let saved={theme:'dark',best:0,games:0,history:[]},storageOK=true;
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v){saved.theme=v.theme==='light'?'light':'dark';saved.best=Math.max(0,Number(v.best)||0);saved.games=Math.max(0,Number(v.games)||0);saved.history=Array.isArray(v.history)?v.history.slice(0,10).filter(r=>r&&['AI','手动'].includes(r.mode)&&Number.isFinite(r.score)&&['验收通过','通关','失败','中途结束'].includes(r.result)):[];}}catch(e){storageOK=false;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){storageOK=false;}$('storage').textContent=storageOK?'主题与战绩保存在当前浏览器。新一局不会清空历史。':'浏览器不允许本地存储：本次仍可游玩，但刷新后可能不保留战绩。';}
// Hamilton cycle: top row, alternating rows excluding x=0, then left column back.
const cycle=[];for(let x=0;x<N;x++)cycle.push({x,y:0});for(let y=1;y<N;y++){if(y%2)for(let x=N-1;x>=1;x--)cycle.push({x,y});else for(let x=1;x<N;x++)cycle.push({x,y});}for(let y=N-1;y>=1;y--)cycle.push({x:0,y});
const cycleIndex=new Map(cycle.map((q,i)=>[q.x+','+q.y,i]));
let snake=[],food=null,dir={x:1,y:0},pending=dir,mode='手动',score=0,steps=0,running=false,paused=false,timer=null,recorded=true;
const same=(a,b)=>a.x===b.x&&a.y===b.y;
function spawnFood(){const occupied=new Set(snake.map(q=>q.x+','+q.y));const free=cycle.filter(q=>!occupied.has(q.x+','+q.y));return free.length?{...free[Math.floor(Math.random()*free.length)]}:null;}
function render(){document.body.classList.toggle('light',saved.theme==='light');const c=$('board').getContext('2d'),light=saved.theme==='light',s=600/N;c.fillStyle=light?'#eaf1f5':'#0b1420';c.fillRect(0,0,600,600);c.strokeStyle=light?'#d7e2e8':'#203148';for(let i=0;i<=N;i++){c.beginPath();c.moveTo(i*s,0);c.lineTo(i*s,600);c.moveTo(0,i*s);c.lineTo(600,i*s);c.stroke();}snake.forEach((q,i)=>{c.fillStyle=i===0?(light?'#176b51':'#73e3b4'):(light?'#55a487':'#378e79');c.fillRect(q.x*s+4,q.y*s+4,s-8,s-8);});if(food){c.fillStyle=light?'#cf642d':'#ffb67e';c.beginPath();c.arc((food.x+.5)*s,(food.y+.5)*s,s*.28,0,Math.PI*2);c.fill();}$('score').textContent=score;$('best').textContent=saved.best;$('games').textContent=saved.games;$('history').replaceChildren();for(const r of saved.history){const tr=document.createElement('tr');for(const v of[r.mode,r.score,r.result]){const td=document.createElement('td');td.textContent=v;tr.append(td);}$('history').append(tr);}}
function record(result){if(recorded)return;recorded=true;saved.best=Math.max(saved.best,score);saved.games++;saved.history.unshift({mode,score,result,date:new Date().toISOString(),steps});saved.history=saved.history.slice(0,10);persist();}
function finish(result){running=false;clearInterval(timer);record(result);$('status').textContent=result==='验收通过'?`AI 验收通过：连续吃完 ${score} 个食物，${steps} 步，零碰撞。`:result==='通关'?'通关！你填满了棋盘。':'游戏结束：撞墙或撞到自己。';render();}
function schedule(){clearInterval(timer);timer=setInterval(step,Number($('speed').value));}
function newGame(m){if(!recorded)record('中途结束');mode=m;snake=[{...cycle[2]},{...cycle[1]},{...cycle[0]}];dir={x:1,y:0};pending=dir;score=0;steps=0;paused=false;running=true;recorded=false;food=spawnFood();$('status').textContent=m==='AI'?'AI 自动演示中，目标 15 个食物。':'手动游戏中：方向键 / WASD 控制，空格暂停。';schedule();render();}
function step(){if(!running||paused)return;let next;if(mode==='AI'){const i=cycleIndex.get(snake[0].x+','+snake[0].y);next={...cycle[(i+1)%cycle.length]};dir={x:next.x-snake[0].x,y:next.y-snake[0].y};}else{dir={...pending};next={x:snake[0].x+dir.x,y:snake[0].y+dir.y};}const eats=food&&same(next,food);const body=eats?snake:snake.slice(0,-1);if(next.x<0||next.x>=N||next.y<0||next.y>=N||body.some(q=>same(q,next))){finish('失败');return;}snake.unshift(next);steps++;if(eats){score++;saved.best=Math.max(saved.best,score);persist();if(snake.length===N*N){finish('通关');return;}food=spawnFood();}else snake.pop();if(mode==='AI'&&score>=15){finish('验收通过');return;}render();}
function turn(x,y){if(mode!=='手动'||!running||paused)return;if(x===-dir.x&&y===-dir.y)return;pending={x,y};}
function pause(){if(!running)return;paused=!paused;$('status').textContent=paused?'已暂停，点击继续或按空格。':mode==='AI'?'AI 自动演示中，目标 15 个食物。':'手动游戏中。';}
$('manual').onclick=()=>newGame('手动');$('ai').onclick=()=>newGame('AI');$('pause').onclick=pause;$('speed').onchange=schedule;$('theme').onclick=()=>{saved.theme=saved.theme==='dark'?'light':'dark';persist();render();};$('reset').onclick=()=>{if(confirm('清空最高分、局数和最近 10 局？')){saved.best=0;saved.games=0;saved.history=[];persist();render();}};
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>turn(...b.dataset.dir.split(',').map(Number)));
const keys={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;const k=e.key.length===1?e.key.toLowerCase():e.key;if(keys[k]){e.preventDefault();turn(...keys[k]);}if(e.code==='Space'){e.preventDefault();pause();}});
let touchStart=null;$('board').addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY};$('board').setPointerCapture(e.pointerId);});$('board').addEventListener('pointerup',e=>{if(!touchStart)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>15){Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy));}touchStart=null;});
// Read-only snapshot for reproducible acceptance tests.
window.snakeSnapshot=()=>({score,steps,running,paused,mode,snake:snake.map(q=>({...q})),food:food&&{...food},saved:JSON.parse(JSON.stringify(saved))});
snake=[{...cycle[2]},{...cycle[1]},{...cycle[0]}];food=spawnFood();$('status').textContent='点击“手动新一局”或“AI 自动演示”开始。';persist();render();
</script></html>
